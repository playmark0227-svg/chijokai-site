name: Deploy static site to Pages

# main に push されるたびに（管理画面からの保存も含む）、
#   1. data/solutions.json から「法人の方へ」の案件一覧を書き出し
#   2. 書き出した HTML をリポジトリにも戻し（手元と公開物をそろえるため）
#   3. サイトに必要なファイルだけを GitHub Pages へ公開する
#      （data/・tools/・Markdown は公開しない）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 書き出した HTML をリポジトリに戻すため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 文字組みの道具（budoux）を用意
        run: pip install --quiet budoux==0.9.2

      - name: 画像変換の道具（cwebp）を用意
        # 取れなくても公開は続ける（新しい画像だけ WebP なしで配信される）
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

      - name: 案件一覧を data/solutions.json から書き出す
        env:
          CI: 'true'   # WebP は無いものだけ作る（版の違う cwebp で既存の WebP を作り直さない）
        run: python3 tools/build-solutions.py

      - name: 書き出した結果をリポジトリに戻す
        run: |
          if [ -n "$(git status --porcelain -- solutions.html index.html assets/img)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A solutions.html index.html assets/img
            git commit -m "案件一覧を data/solutions.json から自動で書き出し"
            # GITHUB_TOKEN での push は、このワークフローを再び起動しない
            git push || echo "::warning::書き出した HTML をリポジトリに戻せませんでした（公開は続けます）"
          else
            echo "書き出し結果に変更はありません"
          fi

      - name: 公開するファイルだけをまとめる
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude '_site' \
            --exclude 'data/' --exclude 'tools/' --exclude '*.md' --exclude '__pycache__/' \
            ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
